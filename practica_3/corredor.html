<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corredor</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section>
            <article>
                <form name="corredor_f1" method="post" action="#" enctype="multipart/form-data">
                    <div id="corredor">
                        <fieldset>
                            <legend>Corredor</legend>
                            <div> 
                                <label>Nombre: </label>
                                <input type="text" id="nombre"/>
                            </div>
                            <div>
                                <label>Apellido Paterno:</label>
                                <input type="text" id="a_paterno"/>
                            </div>
                            <div>
                                <label>Apellido Materno:</label>
                                <input type="text" id="a_materno"/>
                            </div>
                            <div>
                                <label>Edad:</label>
                                <input type="number" id="edad"/>
                            </div>
                            <div>
                                <label>Genero:</label>
                                <input type="radio" name="genero" id="genero" value="Masculino"/>Masculino
                                <input type="radio" name="genero" id="genero" value="Femenino"/>Femenino
                            </div>
                            <div>
                                <label>Foto:</label>
                                <input type="file" id="imagen"/><br> 
                            </div>
                        </fieldset>
                    </div>
                    <button id="boton" onclick="corredor()">Guardar</button>
                </form>
            </article>
        </section>
        <aside>
            <nav>

                    <li><a href="relaciones.html" target="_self">Relaciones</a></li>
                </ol>
            </nav>
        </aside>
    </main>
    <footer>
        <article>
            <nav>
                <h3>Miguel Angel Porras Flores</h3>
            </nav>
        </article>
        <article>
            <h3>LDSM405</h3>
        </article>
    </footer>
    <script src="funcionalidades.js"></script>
</body>
</html>
