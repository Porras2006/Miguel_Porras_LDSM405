<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Agenda Semanal</title>
    <!-- CDN Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="container my-4" style="max-width: 700px;">
        <div class="card shadow">
            <div class="card-header bg-dark text-white py-3">
                <h4 class="mb-0 text-center">Ejercicio 3: Agenda Semanal</h4>
            </div>
            <div class="card-body p-4">

                <!-- Formulario de captura -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Día de la semana:</label>
                        <select id="dia" class="form-select">
                            <option value="lunes">Lunes</option>
                            <option value="martes">Martes</option>
                            <option value="miercoles">Miércoles</option>
                            <option value="jueves">Jueves</option>
                            <option value="viernes">Viernes</option>
                            <option value="sabado">Sábado</option>
                            <option value="domingo">Domingo</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Hora:</label>
                        <input type="text" id="hora" class="form-control" placeholder="Ej. 19:00">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Evento:</label>
                        <input type="text" id="evento" class="form-control" placeholder="Ej. Cafeteria">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Descripción:</label>
                        <input type="text" id="descripcion" class="form-control" placeholder="Ej. Mi roomie paga">
                    </div>

                    <div class="col-12 mt-3">
                        <button class="btn btn-dark w-100 shadow-sm" onclick="guardarEvento()">
                            Guardar Evento
                        </button>
                    </div>
                </div>

                <h5 class="fw-bold border-bottom pb-2">Eventos Programados:</h5>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Día</th>
                                <th>Hora</th>
                                <th>Evento</th>
                                <th>Descripción</th>
                            </tr>
                        </thead>
                        <tbody id="vistaAgenda">
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="js/funciones.js"></script>
    <script>
        actualizarVista();
    </script>
</body>
</html>
