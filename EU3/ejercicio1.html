<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Figura del 8</title>
    <!-- CDN Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="container my-5">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Ejercicio 1: Figura del 8</h4>
            </div>
            <div class="card-body text-center p-4">
                <p class="text-muted mb-4">Haz clic en el botón para generar el patrón del número 8 con letras "s".</p>
                
                <button class="btn btn-primary btn-lg shadow-sm mb-4" onclick="dibujarOcho()">
                    Generar 8
                </button>
                <div class="d-flex justify-content-center">
                    <pre id="resultadoOcho" class="font-monospace fs-3 bg-dark text-success p-3 rounded shadow-inner mb-0" style="letter-spacing: 4px; line-height: 1.2;"></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="js/funciones.js"></script>
</body>
</html>
