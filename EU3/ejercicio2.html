<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Gestión de Alumnos</title>
    <!-- CDN Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="container my-4" style="max-width: 650px;">
        <div class="card shadow">
            <div class="card-header bg-success text-white py-3">
                <h4 class="mb-0 text-center">Ejercicio 2: Lista de Alumnos</h4>
            </div>
            <div class="card-body p-4">
                
                <div class="d-grid gap-2 mb-4">
                    <button class="btn btn-success btn-lg shadow-sm" onclick="capturarAlumnos()">
                        1. Capturar 10 Alumnos
                    </button>
                </div>

                <div class="card mb-3 bg-body-tertiary border">
                    <div class="card-body">
                        <h6 class="card-title fw-bold">Eliminar Rango de Registros</h6>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <input type="number" id="inicio" class="form-control" placeholder="Desde (índice)">
                            </div>
                            <div class="col-6">
                                <input type="number" id="fin" class="form-control" placeholder="Hasta (índice)">
                            </div>
                        </div>
                        <button class="btn btn-danger w-100" onclick="eliminarRango()">
                            Eliminar Rango
                        </button>
                    </div>
                </div>

                <div class="card mb-4 bg-body-tertiary border">
                    <div class="card-body">
                        <h6 class="card-title fw-bold">Vaciar Posición por Nombre</h6>
                        <div class="input-group">
                            <input type="text" id="nombreVaciar" class="form-control" placeholder="Escribe el nombre a vaciar">
                            <button class="btn btn-warning" onclick="vaciarPorNombre()">
                                Vaciar Posición
                            </button>
                        </div>
                    </div>
                </div>

                <h5 class="fw-bold border-bottom pb-2">Registros Actuales:</h5>
                <ul id="listaAlumnos" class="list-group shadow-sm">
                    <li class="list-group-item text-muted text-center">Presiona "Capturar 10 Alumnos" para comenzar.</li>
                </ul>

            </div>
        </div>
    </div>

    <script src="js/funciones.js"></script>
</body>
</html>
